services:
  # Build this first (it is also the image used by `discovery`):
  #   docker compose --profile setup build base
  base:
    build:
      context: .
      dockerfile: base.Dockerfile
    image: f1tenth-base:${BASE_IMAGE_TAG:-slim}
    profiles:
      - setup

  discovery:
    image: f1tenth-base:${BASE_IMAGE_TAG:-slim}
    command: fastdds discovery --server-id 0
    network_mode: host
    ipc: host
    pid: host

  drive:
    build:
      context: ./f1tenth_drive
      args:
        - BASE_IMAGE_TAG=${BASE_IMAGE_TAG:-slim}
    image: f1tenth-drive:${BASE_IMAGE_TAG:-slim}
    depends_on:
      - discovery
    volumes:
      - ./f1tenth_drive:/ros_ws
      - ./client_config.xml:/client_config.xml
      - ./super_client.xml:/super_client.xml
      - ./container_scripts:/container_scripts
    environment:
      - ROS_DISCOVERY_SERVER=localhost:11811
      - FASTRTPS_DEFAULT_PROFILES_FILE=/client_config.xml
      - RMW_FASTRTPS_USE_QOS_FROM_XML=1
    privileged: true
    network_mode: host
    ipc: host

  system:
    build:
      context: ./f1tenth_system
      args:
        - BASE_IMAGE_TAG=${BASE_IMAGE_TAG:-slim}
    image: f1tenth-system:${BASE_IMAGE_TAG:-slim}
    depends_on:
      - discovery
    volumes:
      - ./f1tenth_system:/ros_ws
      - /dev/input:/dev/input:rw
      - /dev/sensors:/dev/sensors:rw
      - ./client_config.xml:/client_config.xml
      - ./super_client.xml:/super_client.xml
      - ./container_scripts:/container_scripts
    environment:
      - ROS_DISCOVERY_SERVER=localhost:11811
      - FASTRTPS_DEFAULT_PROFILES_FILE=/client_config.xml
      - RMW_FASTRTPS_USE_QOS_FROM_XML=1
    devices:
      - /dev/input:/dev/input:rwm
    privileged: true
    network_mode: host
    ipc: host
