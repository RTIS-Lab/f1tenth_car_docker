services:
  base:
    build:
      context: .
      dockerfile: base.Dockerfile
    image: f1tenth-base
    profiles:
      - setup

  discovery:
    image: f1tenth-base
    command: fastdds discovery --server-id 0
    network_mode: host
    ipc: host
    pid: host

  # for X11 forwarding, run `xhost local:docker` on the host first
  drive:
    build:
      context: ./f1tenth_drive
      args:
        - BASE_IMAGE_TAG=${BASE_IMAGE_TAG:-latest}
    image: f1tenth-drive:${BASE_IMAGE_TAG:-latest}
    depends_on:
      - discovery
    volumes:
        - ./f1tenth_drive:/ros_ws
        - ./f1tenth_system:/f1tenth_system
        # Bind the X11 socket from the host
        - /tmp/.X11-unix:/tmp/.X11-unix
        - ${XDG_RUNTIME_DIR}/pipewire-0:/tmp/pipewire-0
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - ./fastdds.xml:/client_config.xml
    environment:
        # Tell apps inside the container where to find the X11 display
        - XDG_RUNTIME_DIR=/tmp
        - DISPLAY=${DISPLAY}
        # Force Intel GPU usage
        - LIBGL_ALWAYS_INDIRECT=0
        - DRI_PRIME=0
        - ROS_DISCOVERY_SERVER=localhost:11811
    # ports:
    #  - "2222:22"  # Map container's SSH port to host port 2222
    # stdin_open: true
    # tty: true
    privileged: true
    pid: host
    cgroup: "host"
    network_mode: host
    ipc: host

  # CUDA/GPU inference on the Jetson.
  #
  # This is Focal-based (dusty-nv l4t-pytorch) so it can use the host CUDA that
  # the nvidia container runtime bind-mounts. It shares the SAME source tree as
  # `drive` (./f1tenth_drive) but builds into build.cuda/install.cuda, and joins
  # the same FastDDS discovery server, so it interoperates with the Jammy
  # containers over DDS. Start with just the RL node; add packages to
  # RL_PACKAGES as you migrate them here.
  rl_inference:
    build:
      context: ./f1tenth_rl_inference
      args:
        - L4T_TAG=${L4T_TAG:-r35.3.1}
    image: f1tenth-rl-inference:${L4T_TAG:-r35.3.1}
    # Requires the nvidia container runtime (registered in /etc/docker/daemon.json).
    runtime: nvidia
    depends_on:
      - discovery
    volumes:
      # Same source as `drive`; separate build/install bases avoid clobbering.
      - ./f1tenth_drive:/ros_ws
      - ./fastdds.xml:/client_config.xml
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DISCOVERY_SERVER=localhost:11811
      - FASTDDS_DEFAULT_PROFILES_FILE=/client_config.xml
      # Space-separated packages to build/run here. Grow this as you move nodes
      # onto the GPU / into one process under ros_preempt.
      - RL_PACKAGES=rtis_f110_rl
    # privileged + pid:host mirror `drive`; needed later for ros_preempt's
    # real-time (SCHED_FIFO) executor experiments.
    privileged: true
    pid: host
    network_mode: host
    ipc: host

  system:
    build:
      context: ./f1tenth_system
      args:
        - BASE_IMAGE_TAG=${BASE_IMAGE_TAG:-latest}
    image: f1tenth-system:${BASE_IMAGE_TAG:-latest}
    depends_on:
      - discovery
    volumes:
      - ./f1tenth_system:/ros_ws
      - /dev/input:/dev/input:rw
      - /dev/sensors:/dev/sensors:rw
      # Bind the X11 socket from the host
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR}/pipewire-0:/tmp/pipewire-0
      - ./fastdds.xml:/client_config.xml
    environment:
      # Tell apps inside the container where to find the X11 display
      - XDG_RUNTIME_DIR=/tmp
      - DISPLAY=${DISPLAY}
      # use software rendering to avoid GPU issues
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DISCOVERY_SERVER=localhost:11811
    devices:
      - /dev/input:/dev/input:rwm
    # stdin_open: true
    # tty: true
    privileged: true
    network_mode: host
    ipc: host
